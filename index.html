<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EBF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Bolso">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="icon" type="image/png" href="icon-v2-192.png">
<title>Meu Bolso</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: app de uma coluna para celular. Cabeçalho fixo com o mês, conteúdo em cartões, barra de abas embaixo e botão flutuante "Registrar". */
:root{
  --bg:#EBF0EE; --surface:#FFFFFF; --ink:#12201C; --muted:#586964; --line:#D6DFDC;
  --accent:#0B7A5E; --accent-ink:#FFFFFF; --out:#B93A27;
  --need:#1F6A8A; --want:#D9A21B; --save:#0B7A5E;
  --warn-bg:#FBF1D9; --warn-fg:#6E4700; --alert-bg:#FBE3DE; --alert-fg:#8E2616; --ok-bg:#DDF1E9; --ok-fg:#075640; --info-bg:#E3EEF3; --info-fg:#164E67;
  --shadow:0 1px 2px rgba(18,32,28,.06),0 6px 18px rgba(18,32,28,.06);
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1412; --surface:#14211E; --ink:#E6F0EC; --muted:#94A9A2; --line:#253733;
  --accent:#3CC99A; --accent-ink:#04231A; --out:#FF8D78;
  --need:#62B6D8; --want:#E8B64B; --save:#3CC99A;
  --warn-bg:#35290D; --warn-fg:#F1CE7A; --alert-bg:#3B1A14; --alert-fg:#FFB4A5; --ok-bg:#12332A; --ok-fg:#8FE3C4; --info-bg:#15303B; --info-fg:#A5D6EA;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1412; --surface:#14211E; --ink:#E6F0EC; --muted:#94A9A2; --line:#253733;
  --accent:#3CC99A; --accent-ink:#04231A; --out:#FF8D78;
  --need:#62B6D8; --want:#E8B64B; --save:#3CC99A;
  --warn-bg:#35290D; --warn-fg:#F1CE7A; --alert-bg:#3B1A14; --alert-fg:#FFB4A5; --ok-bg:#12332A; --ok-fg:#8FE3C4; --info-bg:#15303B; --info-fg:#A5D6EA;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-bottom:150px}
h2{font-family:var(--font-display);font-size:1.05rem;margin:0 0 12px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px}
.top .mes{font-family:var(--font-display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.nav svg{width:18px;height:18px}

.netbar{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:10px 14px;margin:2px 0 8px;font-size:.86rem;line-height:1.35}
/* cartões */
.card{background:var(--surface);border-radius:18px;padding:18px;margin-top:12px;box-shadow:var(--shadow)}
.hero{padding:18px 4px 6px}
.ola{font-family:var(--font-display);font-weight:700;font-size:1.5rem;letter-spacing:-.02em;margin-bottom:14px;overflow-wrap:anywhere}
.welcome .top,.welcome .tabs,.welcome .fab{display:none}
.boas{min-height:70vh;min-height:70dvh;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px 4px}
.boas h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.9rem,9vw,2.6rem);letter-spacing:-.03em;line-height:1.1;margin:0;text-wrap:balance}
.boas form{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--font-display);font-weight:700;font-size:clamp(2.4rem,12vw,3.2rem);letter-spacing:-.03em;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.big.neg{color:var(--out)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 0}
.io div{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.io dt{font-size:.78rem;color:var(--muted);font-weight:500}
.io dd{margin:2px 0 0;font-weight:600;font-size:clamp(.9rem,4.2vw,1.1rem);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media (max-width:359px){.io{grid-template-columns:1fr}.io div[style]{grid-column:auto!important}}
.pos{color:var(--pos,var(--accent))}
.aviso{margin-top:12px;font-size:.85rem;color:var(--info-fg);background:var(--info-bg);border-radius:12px;padding:10px 12px}
.vazio{text-align:left}
.vazio p{color:var(--muted);margin-bottom:14px}

.diario{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.diario b{font-family:var(--font-display);font-size:1.6rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.diario span{color:var(--muted);font-size:.92rem}

.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%;min-width:0}
.bar i+i{margin-left:2px}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.legend div{min-width:0}
.legend .k{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.legend .k s{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.legend small{color:var(--muted);font-size:.74rem}
@media (max-width:399px){
  .legend{grid-template-columns:1fr;gap:10px}
  .legend div{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:baseline}
  .legend small{grid-column:1/-1}
}
.meta-line{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;margin-bottom:8px;flex-wrap:wrap}
.meta-line span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}

.cats{display:flex;flex-direction:column;gap:14px}
.cat .row{display:flex;justify-content:space-between;gap:10px;font-size:.95rem;margin-bottom:6px}
.cat .row span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.cat .row small{color:var(--muted);font-weight:400;margin-left:6px}
.track{position:relative;height:8px;border-radius:4px;background:var(--line)}
.track i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.track i.over{background:var(--out)}
.track u{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.7}

/* extrato */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.92rem;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dia{margin-top:18px}
.dia h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.lista{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item>button{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer;min-height:56px}
.item>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.item .t small{color:var(--muted)}
.item .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;align-self:center}
.item .v.in{color:var(--pos,var(--accent))}
.item .v.inv{color:var(--need)}.item .acts{padding:0 16px 14px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.sum{font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;cursor:pointer;min-height:32px;display:flex;align-items:center;justify-content:space-between;list-style:none}
.sum::-webkit-details-marker{display:none}
.sum::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details[open]>.sum::after{transform:rotate(-135deg)}
.acts2{display:flex;gap:10px;flex-wrap:wrap}
.ghost[disabled]{opacity:.5}
.rn{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rn:first-of-type{border-top:0}
.rn small{display:block;color:var(--muted);font-size:.74rem;margin-bottom:2px}
.novacat{display:grid;gap:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:46px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 16px;min-height:44px}
.ghost.danger{color:var(--out);border-color:var(--out)}

/* metas */
.slider{width:100%;accent-color:var(--accent);margin:8px 0 4px;height:32px}
.hint{color:var(--muted);font-size:.9rem}
.lim{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lim:first-of-type{border-top:0}
.lim .n{min-width:0}
.lim .n small{display:block;color:var(--muted)}
.lim .track{margin-top:6px}
input[type=text],input[type=date],input[type=number]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:46px}
input.moeda{text-align:right}

/* dicas */
.dica{margin-top:12px}
.dica .tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:8px}
.tag.alert{background:var(--alert-bg);color:var(--alert-fg)}
.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.tag.ok{background:var(--ok-bg);color:var(--ok-fg)}
.tag.info{background:var(--info-bg);color:var(--info-fg)}
.dica h3{font-family:var(--font-display);font-size:1.05rem;margin:0 0 4px;letter-spacing:-.01em}
.dica p{color:var(--muted);font-size:.96rem}
.sec{margin:26px 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.ia-out{white-space:pre-wrap;margin-top:14px;font-size:.98rem}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:13px 18px;font-weight:600;min-height:48px}
.primary[disabled]{opacity:.6}
.primary.full{width:100%}

/* barra de abas e botão flutuante */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:.72rem;font-weight:500;min-height:52px}
.tabs button svg{width:24px;height:24px;position:relative;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.tabs button{position:relative;z-index:1;transition:color .2s ease,transform .12s ease}
.tabs button:active{transform:scale(.92)}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs button[aria-current="page"] svg{transform:translateY(-2px) scale(1.1)}
/* pílula que desliza até a aba ativa */
.tabind{position:absolute;left:0;top:0;width:0;height:0;border-radius:14px;background:var(--ok-bg);z-index:0;pointer-events:none;opacity:0}
.tabind.ready{opacity:1;transition:transform .34s cubic-bezier(.3,1,.4,1),width .34s cubic-bezier(.3,1,.4,1),height .2s}
@keyframes goR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes goL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:translateY(2px) scale(.8)}55%{transform:translateY(-4px) scale(1.25)}100%{transform:translateY(-2px) scale(1.1)}}
@media (prefers-reduced-motion:no-preference){
  main.go-r{animation:goR .3s cubic-bezier(.2,.8,.2,1)}
  main.go-l{animation:goL .3s cubic-bezier(.2,.8,.2,1)}
  .tabs button[aria-current="page"] svg{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
}
@media (prefers-reduced-motion:reduce){.tabind.ready,.tabs button svg{transition:none}}
.fab{position:fixed;z-index:7;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:0 20px 0 16px;height:54px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab svg{width:22px;height:22px}

/* folha de lançamento */
html,body{overflow-x:clip}
html.lock,html.lock body{overflow:hidden}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;width:100%;max-width:100%}
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.5);z-index:20;touch-action:none}
/* folha em três partes: topo fixo (alça + título), corpo que rola só na vertical, rodapé fixo com Salvar */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:520px;width:100%;background:var(--surface);border-radius:22px 22px 0 0;
  max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:contain;will-change:transform}
.shead{flex:none;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;border-bottom:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) 2px max(16px,env(safe-area-inset-right,0px))}
.grab-bar{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px}
.shrow{display:flex;align-items:center;justify-content:space-between;min-height:46px}
.shrow strong{font-family:var(--font-display);font-size:1.1rem;letter-spacing:-.01em}
.xbtn{width:44px;height:44px;margin-right:-10px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.xbtn svg{width:22px;height:22px}
.sbody{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px)) 18px max(16px,env(safe-area-inset-right,0px))}
.sbody>*{min-width:0;max-width:100%}
.sfoot{flex:none;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet label{font-size:.82rem;color:var(--muted);font-weight:600;margin-top:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:11px;font-weight:600;color:var(--muted);min-height:46px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
#parcbox{display:flex;flex-direction:column;gap:10px}
.seg.two{grid-template-columns:1fr 1fr}
.seg.two button{font-size:.88rem;padding:10px 6px}
.sheet label.chk{display:flex;gap:12px;align-items:flex-start;font-size:.95rem;color:var(--ink);font-weight:500;min-height:44px;margin-top:0}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding:4px 0}
.amt span{font-family:var(--font-display);font-size:1.4rem;color:var(--muted)}
.amt input{border:0;background:transparent;font-family:var(--font-display);font-weight:700;font-size:2.4rem;letter-spacing:-.02em;color:var(--ink);width:100%;min-width:0;outline:0;padding:0;font-variant-numeric:tabular-nums}
.amt:focus-within{border-color:var(--accent)}
.erro{color:var(--out);font-size:.9rem;min-height:1.2em}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;
  display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast button{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px;min-height:32px}
/* telas largas: duas colunas, barra de abas e botão alinhados à coluna */
@media (min-width:900px){
  .app{max-width:900px}
  main{column-count:2;column-gap:16px}
  main>*{break-inside:avoid}
  .welcome main{column-count:1}
  .tabs{left:50%;right:auto;width:min(900px,100%);transform:translateX(-50%);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0}
  .fab{right:max(16px,calc((100vw - 900px)/2 + 16px))}
}
@media (min-width:600px) and (max-width:899px){.app{max-width:640px}.tabs{left:50%;right:auto;width:min(640px,100%);transform:translateX(-50%);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0}.fab{right:max(16px,calc((100vw - 640px)/2 + 16px))}}
/* celular deitado: barra de abas mais baixa */
@media (max-height:500px){
  .tabs button{flex-direction:row;justify-content:center;gap:8px;min-height:40px;font-size:.8rem}
  .tabs button svg{width:20px;height:20px}
  .fab{height:46px;bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .app{padding-bottom:120px}
  .sheet{max-height:100vh;max-height:100dvh;border-radius:0}
}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:sheetIn .38s cubic-bezier(.22,1,.36,1)}
  #sheet .scrim{animation:scrimIn .3s ease-out}
  .fab{transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .25s ease}
}
.fab.away{transform:translateY(96px);opacity:0;pointer-events:none}

/* ---------- polimento visual, inspirado nos apps do iOS ---------- */
:root{
  --font-display:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  --glass:rgba(255,255,255,.74); --glass-line:rgba(18,32,28,.09); --bg-glass:rgba(235,240,238,.82); --fill:rgba(88,105,100,.12);
  --shadow:0 1px 1px rgba(18,32,28,.04),0 8px 24px rgba(18,32,28,.06);
  --barb:max(10px,calc(env(safe-area-inset-bottom,0px) - 8px)); --barh:68px;
}

    <button class="ghost danger" type="button" data-act="delsheet" id="delbtn" hidden>Excluir lançamento</button>
    <button class="ghost danger" type="button" data-act="delsheet2" id="delbtn2" hidden>Excluir esta e as parcelas seguintes</button>
    </div>
    <div class="sfoot"><button class="primary full" type="submit" id="savebtn">Salvar</button></div>
  </form>
</div>

<div id="toast" hidden></div>

<script>
(function(){
const CATS={
  e:[
    {id:'moradia',n:'Moradia',g:'need'},{id:'mercado',n:'Mercado',g:'need'},{id:'transporte',n:'Transporte',g:'need'},
    {id:'saude',n:'Saúde',g:'need'},{id:'educacao',n:'Educação',g:'need'},{id:'dividas',n:'Dívidas e parcelas',g:'need'},
    {id:'fora',n:'Comer fora',g:'want'},{id:'lazer',n:'Lazer',g:'want'},{id:'assin',n:'Assinaturas',g:'want'},
    {id:'compras',n:'Compras',g:'want'},{id:'outros',n:'Outros',g:'want'}],
  i:[{id:'salario',n:'Salário'},{id:'extra',n:'Renda extra'},{id:'outros_i',n:'Outras entradas'}],
  v:[{id:'reserva',n:'Reserva de emergência'},{id:'rfixa',n:'Renda fixa'},{id:'rvar',n:'Ações e fundos'},{id:'prev',n:'Previdência'},{id:'inv_o',n:'Outros investimentos'}]
};
const allCats=k=>{const nm=S.cfg.names||{};return [...CATS[k].map(c=>({...c,n:nm[c.id]||c.n})),...(S.cfg.custom||[]).filter(c=>c.k===k)]};
const catOf=id=>allCats('e').concat(allCats('i'),allCats('v')).find(c=>c.id===id);
const nameOf=id=>(catOf(id)||{}).n||'Sem categoria';
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=n=>BRL.format(Math.round((n||0)*100)/100);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const todayStr=()=>{const d=new Date();return ymOf(d)+'-'+pad(d.getDate())};
const shiftYm=(ym,k)=>{const [y,m]=ym.split('-').map(Number);return ymOf(new Date(y,m-1+k,1))};
const daysIn=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pct=(a,b)=>b>0?a/b*100:0;
const rnd=v=>Math.round(v*100)/100;

const S={uid:null,db:null,local:false,ym:ymOf(new Date()),tab:'resumo',tx:[],prevTx:[],nextTx:[],mode:'p',loaded:false,
  cfg:{savePct:20,limits:{},names:{},custom:[],name:'',recs:[]},cfgLoaded:false,offline:false,recFor:null,rec:false,editT:null,pending:0,filter:'todos',open:null,editId:null,confirm:null,undoFn:null,kind:'e',cat:null,ai:null,aiText:'',aiBusy:false,unMonth:null,undo:null};

/* ---------- armazenamento ---------- */
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let chain=Promise.resolve();
function queue(fn){
  S.pending++;
  chain=chain.then(fn).catch(()=>toast('Não consegui salvar agora. Confira a conexão e tente de novo.')).then(()=>{S.pending--});
}
/* Funciona sem internet: tudo é copiado no aparelho antes de ir para a conta. Se o envio falhar,
   o documento fica marcado como pendente e sobe sozinho quando a conexão voltar. */
const CK=k=>'mbc:'+S.uid+':'+k;
const cacheGet=k=>lsGet(CK(k));
const cachePut=(k,v)=>lsSet(CK(k),v);
const listGet=n=>lsGet(CK(n))||[];
const dirtyList=()=>listGet('dirty');
const isDirty=k=>dirtyList().includes(k);
function listMark(n,k,on){const d=new Set(listGet(n));on?d.add(k):d.delete(k);lsSet(CK(n),[...d])}
const markDirty=(k,on)=>listMark('dirty',k,on);
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
const docPath=k=>'data/users/'+S.uid+'/'+k;
function setOffline(on){
  if(S.offline===on)return;
  S.offline=on;
  const b=$('#netbar');if(b)b.hidden=!on;
}
async function dbWrite(key,body){
  const hadBase=cacheGet(key)!=null;
  cachePut(key,body);markDirty(key,true);
  /* sem cópia anterior não dá para saber o que há na conta: se o envio atrasar, junta os dois lados depois */
  const later=()=>{if(!hadBase&&key[0]==='m')listMark('merge',key,true);setOffline(true);scheduleFlush()};
  if(S.offline){later();return}
  try{
    await withTimeout(S.db.doc(docPath(key)).set(body),7000);
    markDirty(key,false);if(!dirtyList().length)setOffline(false);
  }catch(e){later()}
}
let flushing=false,flushT=0;
function scheduleFlush(){clearTimeout(flushT);flushT=setTimeout(flush,12000)}
async function flush(){
  if(!S.db)return;
  if(flushing){S.reflush=true;return}   /* já há um envio em andamento: repete assim que ele terminar */
  const keys=dirtyList();
  if(!keys.length){setOffline(false);return}
  flushing=true;
  try{
    for(const key of keys){
      let body=cacheGet(key);
      if(body!=null){
        if(listGet('merge').includes(key)){
          /* mês gravado sem conhecer o que já existia na conta: junta os dois lados */
          const s=await withTimeout(S.db.doc(docPath(key)).get(),7000);
          const server=(s.exists&&s.data().tx)||[],ids=new Set((body.tx||[]).map(x=>x.id));
          body={tx:[...server.filter(x=>!ids.has(x.id)),...(body.tx||[])]};cachePut(key,body);
          if(key==='m_'+S.ym){S.tx=body.tx;S.recFor=null;render()}
        }
        await withTimeout(S.db.doc(docPath(key)).set(body),7000);
      }
      markDirty(key,false);listMark('merge',key,false);
    }
    setOffline(false);toast('De volta online. Suas alterações foram enviadas.');
  }catch(e){if(!S.reflush){setOffline(true);scheduleFlush()}}
  flushing=false;
  if(S.reflush){S.reflush=false;flush()}
}
function saveMonth(ym=S.ym,tx=S.tx){
  if(S.db) queue(()=>dbWrite('m_'+ym,{tx}));
  else lsSet('mb:'+ym,tx);
}
function saveCfg(){
  const cfg=S.cfg;
  if(S.db) queue(()=>dbWrite('cfg',cfg));
  else lsSet('mb:cfg',cfg);
}
const typing=()=>{const a=document.activeElement;return a&&a.closest&&a.closest('#main')&&/INPUT/.test(a.tagName)};
function watchMonth(){
  if(S.unMonth){S.unMonth();S.unMonth=null}
  clearTimeout(S.loadT);
  const ym=S.ym,key='m_'+ym;S.loaded=false;S.recFor=null;S.tx=[];S.prevTx=[];S.nextTx=[];render();
  if(S.db){
    let first=true,got=false;
    const local=()=>{const c=cacheGet(key);return (c&&c.tx)||[]};
    /* sem resposta da conta (offline): mostra a cópia que está no aparelho */
    const fromCache=()=>{if(S.ym!==ym||got)return;S.tx=local();S.loaded=true;setOffline(true);if(!typing())render()};
    S.loadT=setTimeout(fromCache,S.offline?0:3500);
    S.unMonth=S.db.doc(docPath(key)).onSnapshot(snap=>{
      if(S.ym!==ym)return;
      got=true;clearTimeout(S.loadT);
      const server=(snap.exists&&snap.data().tx)||[];
      if(isDirty(key)){S.tx=local();flush()}
      else if(first||!S.pending){S.tx=server;cachePut(key,{tx:server})}
      first=false;S.loaded=true;
      if(!(snap.metadata&&snap.metadata.fromCache)&&!dirtyList().length)setOffline(false);
      if(!typing())render();
    },()=>fromCache());
    loadMonth(shiftYm(ym,-1)).then(t=>{if(S.ym===ym){S.prevTx=t;if(!typing())render()}});
    refreshNext();
  }else{
    S.tx=lsGet('mb:'+ym)||[];S.prevTx=lsGet('mb:'+shiftYm(ym,-1))||[];S.nextTx=recFill(shiftYm(ym,1),lsGet('mb:'+shiftYm(ym,1))||[]).tx;S.loaded=true;render();
  }
}

/* ---------- parcelas: meses futuros ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function loadMonth(ym){
  if(!S.db)return lsGet('mb:'+ym)||[];
  const key='m_'+ym,c=cacheGet(key),local=()=>(c&&c.tx)||[];
  if(isDirty(key)||S.offline)return local();
  try{
    const s=await withTimeout(S.db.doc(docPath(key)).get(),5000);
    const tx=(s.exists&&s.data().tx)||[];cachePut(key,{tx});return tx;
  }catch(e){setOffline(true);return local()}
}
async function writeMonth(ym,tx){
  if(S.db)await dbWrite('m_'+ym,{tx});else lsSet('mb:'+ym,tx);
}
function refreshNext(){
  const ym=S.ym,nx=shiftYm(ym,1);
  return loadMonth(nx).then(t=>{if(S.ym===ym){S.nextTx=recFill(nx,t).tx;if(!typing())render()}}).catch(()=>{});
}
/* gastos que se repetem todo mês (assinaturas): a série fica em cfg.recs e cada mês ganha a sua cópia ao ser aberto */
const recActive=(r,ym)=>ym>=r.start&&(!r.end||ym<=r.end)&&!(r.skip||[]).includes(ym);
function recFill(ym,tx){
  let out=tx,changed=false;
  for(const r of (S.cfg.recs||[])){
    if(!recActive(r,ym)||out.some(x=>x.grp===r.grp))continue;
    out=[...out,{id:uid(),t:r.t,v:r.v,c:r.c,d:r.d,date:ym+'-'+pad(Math.min(r.day,daysIn(ym))),grp:r.grp,rec:1}];changed=true;
  }
  return {tx:out,changed};
}
function ensureRecs(){
  if(!S.loaded||!S.cfgLoaded||S.recFor===S.ym||!(S.cfg.recs||[]).length)return;
  S.recFor=S.ym;
  const f=recFill(S.ym,S.tx);
  if(f.changed){S.tx=f.tx;saveMonth()}
  let bump=false;
  const recs=S.cfg.recs.map(r=>{if(recActive(r,S.ym)&&(!r.upto||r.upto<S.ym)){bump=true;return {...r,upto:S.ym}}return r});
  if(bump){S.cfg={...S.cfg,recs};saveCfg()}
}
const setRec=(grp,fn)=>{S.cfg={...S.cfg,recs:S.cfg.recs.map(r=>r.grp===grp?fn(r):r)};saveCfg()};
/* items: [{ym, tx}] acrescenta cada lançamento ao seu mês */
function addFuture(items){
  queue(async()=>{
    for(const {ym,tx} of items){const cur=await loadMonth(ym);await writeMonth(ym,[...cur,tx])}
    await refreshNext();
  });
}
/* aplica fn às parcelas seguintes de t; fn(listaDoMês, ym) devolve a nova lista, ou null para não gravar */
function mutateFuture(t,fn){
  const ym0=S.ym,k=t.of-t.n;
  queue(async()=>{
    for(let i=1;i<=k;i++){const ym=shiftYm(ym0,i);const nx=fn(await loadMonth(ym),ym);if(nx)await writeMonth(ym,nx)}
    await refreshNext();
  });
}
/* cria a série mensal a partir de um lançamento; devolve o id do grupo */
function newSeries(base){
  const grp='g'+uid();
  const r={grp,t:'e',v:base.v,c:base.c,d:base.d,day:+base.date.slice(8),start:S.ym,end:null,skip:[],upto:S.ym};
  S.cfg={...S.cfg,recs:[...(S.cfg.recs||[]),r]};saveCfg();S.recFor=S.ym;
  return grp;
}
/* aplica fn aos meses de from até to (AAAA-MM), gravando só os que ela devolver */
function mutateRange(from,to,fn){
  queue(async()=>{
    for(let ym=from;ym<=to;ym=shiftYm(ym,1)){const nx=fn(await loadMonth(ym),ym);if(nx)await writeMonth(ym,nx)}
    await refreshNext();
  });
}
/* aplica fn a todos os outros meses do parcelamento (antes e depois do mês aberto) */
function mutateGroup(t,fn){
  const ym0=S.ym,from=-(t.n-1),to=t.of-t.n;
  queue(async()=>{
    for(let i=from;i<=to;i++){if(!i)continue;const ym=shiftYm(ym0,i);const nx=fn(await loadMonth(ym),ym);if(nx)await writeMonth(ym,nx)}
    await refreshNext();
  });
}
/* gera as parcelas nFrom..nTo; curN é o número da parcela que está no mês aberto */
function parcelItems(base,curN,nFrom,nTo,grp,of,amt){
  const day=+base.date.slice(8),items=[];
  for(let n=nFrom;n<=nTo;n++){const ym=shiftYm(S.ym,n-curN);items.push({ym,tx:{...base,id:uid(),v:amt(n),date:ym+'-'+pad(Math.min(day,daysIn(ym))),grp,n,of}})}
  return items;
}
const split=(total,n)=>{const per=Math.floor(total/n*100)/100;const a=Array(n).fill(per);a[n-1]=rnd(total-per*(n-1));return a};

/* ---------- cálculos ---------- */
function calc(tx){
  const r={inc:0,exp:0,inv:0,need:0,want:0,by:{},invBy:{}};
  for(const t of tx){
    if(t.t==='i'){r.inc+=t.v;continue}
    if(t.t==='v'){r.inv+=t.v;r.invBy[t.c]=(r.invBy[t.c]||0)+t.v;continue}
    r.exp+=t.v;r.by[t.c]=(r.by[t.c]||0)+t.v;
    const c=catOf(t.c);
    if(c&&c.g==='need')r.need+=t.v;else r.want+=t.v;
  }
  r.bal=r.inc-r.exp-r.inv;r.saved=r.inv+Math.max(r.bal,0);return r;
}
const isCurrent=()=>S.ym===ymOf(new Date());
const lastBiz=ym=>{const [y,m]=ym.split('-').map(Number);let d=new Date(y,m,0);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);return d};
const APP_URL=location.href.split('#')[0];
const daysLeft=()=>daysIn(S.ym)-new Date().getDate()+1;

/* ---------- previsão do próximo mês ---------- */
const mName=(ym,withYear)=>{const [y,m]=ym.split('-').map(Number);return cap(new Date(y,m-1,1).toLocaleDateString('pt-BR',withYear?{month:'long',year:'numeric'}:{month:'long'}))};
function forecast(c,p){
  const rendas=[c.inc,p.inc].filter(v=>v>0),gastos=[c.exp,p.exp].filter(v=>v>0);
  if(!rendas.length&&!gastos.length)return null;
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const key=t=>(t.d||'').trim().toLowerCase();
  const sum=tx=>{const m=new Map();for(const t of tx){if(t.t!=='e'||t.grp||!key(t))continue;const e=m.get(key(t))||{n:t.d,v:0};e.v+=t.v;m.set(key(t),e)}return m};
  const a=sum(S.tx),b=sum(S.prevTx),rec=[];
  for(const [k,e] of a){if(b.has(k))rec.push({n:e.n,v:(e.v+b.get(k).v)/2})}
  rec.sort((x,y)=>y.v-x.v);
  const parc=S.nextTx.filter(t=>t.t==='e'&&t.grp).map(t=>({n:t.d||nameOf(t.c),v:t.v,i:t.n,of:t.of,rec:t.rec})).sort((x,y)=>y.v-x.v);
  const parcTotal=parc.reduce((s,r)=>s+r.v,0);
  const exSem=tx=>tx.filter(t=>t.t==='e'&&!t.grp).reduce((s,t)=>s+t.v,0);
  const gasto=avg([S.tx,S.prevTx].filter(x=>x.length).map(exSem))+parcTotal;
  const renda=avg(rendas),fixos=rec.reduce((s,r)=>s+r.v,0)+parcTotal,nm=shiftYm(S.ym,1),dias=daysIn(nm);
  const meta=renda*S.cfg.savePct/100;
  return {renda,gasto,rec,parc,parcTotal,fixos,nm,dias,meta,livre:renda-fixos-meta,sobra:renda-gasto,bases:[c.exp>0||c.inc>0?S.ym:null,p.exp>0||p.inc>0?shiftYm(S.ym,-1):null].filter(Boolean)};
}
function vPrev(c,p){
  const f=forecast(c,p);if(!f)return '';
  let h=`<section class="card"><h2>O que esperar de ${esc(mName(f.nm))}</h2>
    <dl class="io" style="margin-top:0"><div><dt>Renda esperada</dt><dd class="pos">${f.renda>0?brl(f.renda):'—'}</dd></div><div><dt>Gastos esperados</dt><dd>${f.gasto>0?brl(f.gasto):'—'}</dd></div></dl>`;
  if(f.renda>0){
    if(f.livre>0)h+=`<div class="diario" style="margin-top:14px"><b>${brl(f.livre/f.dias)} por dia</b><span>livres em ${f.dias} dias, depois de pagar o que se repete${f.fixos>0?` (${brl(f.fixos)})`:''} e separar a meta de economia (${brl(f.meta)}).</span></div>`;
    else h+=`<p class="hint" style="margin-top:14px">As contas que se repetem e a meta de economia já consomem toda a renda esperada. Reduza a meta, renegocie uma conta fixa ou busque renda extra para fechar ${esc(mName(f.nm))} no azul.</p>`;
    if(f.sobra<0)h+=`<p class="hint" style="margin-top:10px">No ritmo atual você gastaria ${brl(-f.sobra)} a mais do que ganha. Escolha um gasto para cortar já no início do mês.</p>`;
    else if(f.sobra<f.meta)h+=`<p class="hint" style="margin-top:10px">No ritmo atual sobrariam ${brl(f.sobra)}, abaixo da meta de ${brl(f.meta)}. Falta ${brl(f.meta-f.sobra)}.</p>`;
    else h+=`<p class="hint" style="margin-top:10px">No ritmo atual sobrariam ${brl(f.sobra)}, acima da meta de economia.</p>`;
  }
  if(f.parc.length){
    h+=`<p class="lbl" style="margin:16px 0 6px">Parcelas e assinaturas já agendadas · ${brl(f.parcTotal)}</p><div class="cats">`+f.parc.slice(0,6).map(r=>`<div class="cat"><div class="row"><span>${esc(r.n)}<small>${r.rec?'todo mês':r.i+'/'+r.of}</small></span><span>${brl(r.v)}</span></div></div>`).join('')+`</div>`;
  }
  if(f.rec.length){
    h+=`<p class="lbl" style="margin:16px 0 6px">Contas que se repetem</p><div class="cats">`+f.rec.slice(0,5).map(r=>`<div class="cat"><div class="row"><span>${esc(r.n)}</span><span>${brl(r.v)}</span></div></div>`).join('')+`</div>`;
  }else if(!f.parc.length){
    h+=`<p class="hint" style="margin-top:14px">Dê o mesmo nome aos gastos que se repetem todo mês, como "Aluguel" ou "Internet". Com dois meses registrados eu listo aqui o que já está comprometido.</p>`;
  }
  h+=`<p class="hint" style="margin-top:12px;font-size:.82rem">Estimativa com a média de ${f.bases.map(b=>esc(mName(b))).reverse().join(' e ')}.</p></section>`;
  return h;
}

/* ---------- visão do ano: meses já vividos e previsão dos próximos, em janelas ---------- */
let yTok=0;
const MON=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const YR={rows:[],idx:-1,closing:false};
const reducedMotion=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
async function yearData(y){
  const cur=ymOf(new Date()),base=[shiftYm(cur,-2),shiftYm(cur,-1),cur];
  const yms=Array.from({length:12},(_,i)=>y+'-'+pad(i+1)),got={};
  await Promise.all([...new Set([...yms,...base])].map(async ym=>{got[ym]=ym===S.ym?S.tx:await loadMonth(ym)}));
  const exSem=tx=>tx.filter(t=>t.t==='e'&&!t.grp).reduce((s,t)=>s+t.v,0);
  const avg=a=>a.length?a.reduce((x,v)=>x+v,0)/a.length:0;
  const withData=base.map(ym=>got[ym]).filter(tx=>tx.length);
  const renda=avg(withData.map(tx=>calc(tx).inc).filter(v=>v>0)),varExp=avg(withData.map(exSem));
  const topReal=c=>Object.entries(c.by).map(([k,v])=>[nameOf(k),v]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topSched=tx=>tx.filter(t=>t.t==='e'&&t.grp).map(t=>[t.d||nameOf(t.c),t.v]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return yms.map(ym=>{
    const tx=ym>cur?recFill(ym,got[ym]).tx:got[ym],c=calc(tx);
    if(ym<=cur)return {ym,real:true,empty:!tx.length,inc:c.inc,exp:c.exp,inv:c.inv,bal:c.bal,sched:0,top:topReal(c)};
    const sched=tx.filter(t=>t.t==='e'&&t.grp).reduce((s,t)=>s+t.v,0),inc=c.inc>0?c.inc:renda,exp=sched+Math.max(varExp,exSem(tx));
    return {ym,real:false,empty:!(inc||exp||c.inv),inc,exp,inv:c.inv,bal:inc-exp-c.inv,sched,top:topSched(tx)};
  });
}
function yearHtml(y,rows){
  const cur=ymOf(new Date()),have=rows.filter(r=>!r.empty),T=k=>have.reduce((s,r)=>s+r[k],0);
  const fut=rows.filter(r=>!r.real&&!r.empty);
  let h=`<section class="hero"><p class="lbl">Saldo de ${y}${fut.length?' (com previsão)':''}</p><p class="big ${T('bal')<0?'neg':''}">${brl(T('bal'))}</p>
    <dl class="io"><div><dt>Entradas</dt><dd>${brl(T('inc'))}</dd></div><div><dt>Saídas</dt><dd>${brl(T('exp'))}</dd></div>${T('inv')>0?`<div style="grid-column:1/-1"><dt>Investido</dt><dd>${brl(T('inv'))}</dd></div>`:''}</dl></section>`;
  if(fut.length){
    const worst=fut.reduce((a,b)=>b.bal<a.bal?b:a),best=fut.reduce((a,b)=>b.bal>a.bal?b:a),sched=fut.reduce((s,r)=>s+r.sched,0),L=[];

    else if(fut.length>1)L.push([`${mName(worst.ym)} será o mês mais apertado`,`Sobram ${brl(worst.bal)} nele, contra ${brl(best.bal)} em ${mName(best.ym)}.`]);
    if(sched>0)L.push([`${brl(sched)} já estão comprometidos`,'É a soma das parcelas e assinaturas já agendadas para os meses que faltam neste ano.']);
    h+=`<section class="card"><h2>Olhando para frente</h2>${L.map(([t,b])=>`<div class="ytip"><b>${esc(t)}</b><p class="hint">${esc(b)}</p></div>`).join('')}<p class="hint" style="font-size:.82rem">Os meses "previstos" usam a média de renda e gastos dos seus últimos meses, mais as parcelas e assinaturas já agendadas.</p></section>`;
  }
  h+=`<p class="lbl2" style="margin:18px 4px 0">Toque em um mês para ver os detalhes</p><div class="ygrid">`+rows.map((r,i)=>{
    const isCur=r.ym===cur,ratio=r.inc>0?Math.min(100,pct(r.exp+r.inv,r.inc)):(r.exp>0?100:0);

/* janela de um mês: cresce a partir do quadradinho, troca de mês com um deslize e fecha arrastando para baixo */
const mArrow=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${d?'M9 5l7 7-7 7':'M15 5l-7 7 7 7'}"/></svg>`;
function mcHtml(r,i){
  const isCur=r.ym===ymOf(new Date()),y=r.ym.slice(0,4),badge=isCur?'Mês atual':r.real?'':'Previsto';
  const ratio=r.inc>0?Math.min(100,pct(r.exp+r.inv,r.inc)):(r.exp>0?100:0);
  return `<div class="mh">
    <button type="button" class="nav" data-act="mprev" aria-label="Mês anterior"${i<=0?' disabled':''}>${mArrow(0)}</button>
    <div class="mt"><b>${esc(mName(r.ym))}</b><small>${y}${badge?' · '+badge:''}</small></div>
    <button type="button" class="nav" data-act="mnext" aria-label="Próximo mês"${i>=YR.rows.length-1?' disabled':''}>${mArrow(1)}</button>
    <button type="button" class="xbtn" data-act="mclose" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="mb">${r.empty
    ?`<p class="hint" style="padding:34px 8px;text-align:center">${r.real?'Nada registrado neste mês.':'Ainda não há dados para prever este mês.'}</p>`
    :`<div class="mbig ${r.bal<0?'neg':''}"><span>${r.bal<0?'Faltou':'Sobra'}${r.real?'':' (previsto)'}</span><b>${brl(Math.abs(r.bal))}</b></div>
    <div class="mst"><div><small>Entrou</small><b>${brl(r.inc)}</b></div><div><small>Saiu</small><b>${brl(r.exp)}</b></div><div><small>Investiu</small><b>${brl(r.inv)}</b></div></div>
    <div class="mtrack" role="img" aria-label="${Math.round(ratio)}% da renda usada"><i class="${r.bal<0?'over':''}" style="width:${Math.round(ratio)}%"></i></div>
    <p class="lbl2">${r.real?'Onde o dinheiro foi':'Já agendado para este mês'}</p>
    <div class="mlist">${r.top.length?r.top.map(([n,v])=>`<div class="mrow"><span>${esc(n)}</span><b>${brl(v)}</b></div>`).join(''):`<p class="hint">${r.real?'Nenhum gasto registrado.':'Nada agendado ainda. A previsão usa a média dos seus últimos meses.'}</p>`}</div>`}
  </div>
  <div class="mf"><button type="button" class="primary full" data-act="ygo" data-ym="${r.ym}">Abrir ${esc(mName(r.ym))}</button></div>`;
}
const monthTiles=()=>[...document.querySelectorAll('.ytile')];
function markTile(i){monthTiles().forEach((t,k)=>{t.style.visibility=k===i?'hidden':''})}
function winEl(){
  let w=$('#mwin');if(w)return w;
  w=document.createElement('div');w.id='mwin';w.className='mwin';w.hidden=true;
  w.innerHTML='<div class="mscrim" data-act="mclose"></div><div class="mcard" role="dialog" aria-modal="true" aria-label="Detalhes do mês"><div class="mc" id="mc"></div></div>';
  document.body.append(w);bindWin(w);return w;
}
function openMonthWin(i,tile){
  const r=YR.rows[i];if(!r||YR.closing)return;
  YR.idx=i;
  const w=winEl(),card=w.querySelector('.mcard'),vw=innerWidth,vh=innerHeight;
  $('#mc').innerHTML=mcHtml(r,i);
  const W=Math.min(vw-32,440),H=Math.min(vh-72,600),L=(vw-W)/2,T=Math.max(24,(vh-H)/2),rc=tile.getBoundingClientRect();
  w.hidden=false;w.classList.remove('open');
  card.style.transition='none';
  Object.assign(card.style,{left:rc.left+'px',top:rc.top+'px',width:rc.width+'px',height:rc.height+'px',borderRadius:'22px',transform:'none'});
  markTile(i);
  void card.offsetWidth;card.style.transition='';
  requestAnimationFrame(()=>{w.classList.add('open');Object.assign(card.style,{left:L+'px',top:T+'px',width:W+'px',height:H+'px',borderRadius:'28px'})});
  setTimeout(()=>{const x=card.querySelector('.xbtn');if(x)x.focus({preventScroll:true})},140);
}
function hideMonthWin(){
  const w=$('#mwin');if(!w)return;
  w.hidden=true;w.classList.remove('open');YR.closing=false;monthTiles().forEach(t=>{t.style.visibility=''});
  const c=w.querySelector('.mcard');c.style.transition='';c.style.transform='none';
}
function closeMonthWin(){
  const w=$('#mwin');if(!w||w.hidden||YR.closing)return;
  const tile=monthTiles()[YR.idx];
  if(!tile||reducedMotion()){hideMonthWin();return}
  YR.closing=true;
  tile.style.visibility='';tile.scrollIntoView({block:'nearest'});tile.style.visibility='hidden';
  const rc=tile.getBoundingClientRect(),card=w.querySelector('.mcard');
  w.classList.remove('open');
  Object.assign(card.style,{left:rc.left+'px',top:rc.top+'px',width:rc.width+'px',height:rc.height+'px',borderRadius:'22px'});
  setTimeout(hideMonthWin,470);
}
function dismissDrag(){
  const w=$('#mwin'),card=w.querySelector('.mcard');YR.closing=true;
  card.style.transition='transform .32s cubic-bezier(.5,0,.9,.5)';card.style.transform='translateY('+innerHeight+'px)';
  w.classList.remove('open');setTimeout(hideMonthWin,330);
}
function mNav(d){
  const n=YR.idx+d;if(n<0||n>=YR.rows.length||YR.closing)return;
  YR.idx=n;$('#mc').innerHTML=mcHtml(YR.rows[n],n);markTile(n);
  if(!reducedMotion())document.querySelectorAll('#mc .mt,#mc .mb').forEach(e=>{e.classList.remove('sl-r','sl-l');void e.offsetWidth;e.classList.add(d>0?'sl-r':'sl-l')});
}
function bindWin(w){
  const card=w.querySelector('.mcard'),scrim=w.querySelector('.mscrim');let g=null;
  card.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||YR.closing){g=null;return}
    const t=e.touches[0];g={x:t.clientX,y:t.clientY,m:null,dx:0,dy:0,ts:e.timeStamp};
  },{passive:true});
  card.addEventListener('touchmove',e=>{
    if(!g)return;
    const t=e.touches[0];g.dx=t.clientX-g.x;g.dy=t.clientY-g.y;
    if(!g.m){
      if(Math.abs(g.dx)>10&&Math.abs(g.dx)>Math.abs(g.dy)*1.2)g.m='h';
      else if(g.dy>10&&g.dy>Math.abs(g.dx)){const l=e.target.closest('.mb');if(l&&l.scrollTop>0){g=null;return}g.m='v'}
      else if(Math.abs(g.dy)>10){g=null;return}
      else return;
    }
    if(g.m==='v'){
      if(e.cancelable)e.preventDefault();
      const dy=Math.max(0,g.dy);card.style.transition='none';
      card.style.transform='translateY('+dy+'px) scale('+(1-Math.min(dy,300)/1800)+')';
      scrim.style.opacity=String(Math.max(0,1-dy/420));
    }
  },{passive:false});
  card.addEventListener('touchend',e=>{
    if(!g)return;
    const m=g.m,dx=g.dx,dy=g.dy,v=dy/Math.max(1,e.timeStamp-g.ts);g=null;
    if(m==='v'){
      scrim.style.opacity='';
      if(dy>110||v>.7)dismissDrag();
      else{card.style.transition='';card.style.transform='none'}
    }else if(m==='h'&&Math.abs(dx)>60)mNav(dx<0?1:-1);
  },{passive:true});
}

    `<div class="novacat"><label class="hint" for="ncn">Nova categoria</label>

      <button class="primary" data-act="addcat">Adicionar categoria</button></div></details></section>`;
  h+=installCard();
  h+=tipsCard();
  h+=backupCard();
  const n=S.tx.length;
  h+=`<section class="card"><h2>Recomeçar do zero</h2><p class="hint" style="margin-bottom:12px">Errou no começo ou quer registrar tudo de novo? Apague e comece limpo.</p>`;
  if(S.confirm==='mes')h+=`<p style="margin-bottom:12px"><b>Apagar ${n} ${n===1?'lançamento':'lançamentos'} de ${esc(monthLabel())}?</b> Você poderá desfazer logo em seguida.</p>
    <div class="acts2"><button class="ghost danger" data-act="wipemes">Sim, apagar o mês</button><button class="ghost" data-act="noask">Cancelar</button></div>`;
  else if(S.confirm==='tudo')h+=`<p style="margin-bottom:12px"><b>Apagar tudo?</b> Isso remove os lançamentos de todos os meses, as metas, os limites e os nomes de categorias que você criou. <b>Não dá para desfazer.</b></p>

function tips(c,p){
  const out=[],inc=c.inc,goal=inc*S.cfg.savePct/100;
  if(!S.tx.length)return [{lv:'info',t:'Comece registrando tudo',b:'Anote entradas e gastos por duas semanas. Sem ver para onde o dinheiro vai, qualquer meta vira chute. As dicas deste mês aparecem aqui conforme você registra.'}];
  if(inc===0)out.push({lv:'warn',t:'Falta registrar sua renda',b:'Adicione salário e outras entradas do mês. Com elas calculo quanto sobra, quanto dá para gastar por dia e se você está na meta.'});
  if(inc>0&&inc-c.exp<0)out.push({lv:'alert',t:`Você gastou ${brl(c.exp-inc)} a mais do que ganhou`,b:'Corte primeiro o que não é necessidade (comer fora, compras, assinaturas). Evite cobrir a diferença com rotativo do cartão ou cheque especial: estão entre os juros mais altos do país.'});
  if(inc>0&&inc-c.exp>=0){
    if(c.saved>=goal)out.push({lv:'ok',t:'Meta de economia no caminho',b:`Você guardou ${brl(c.saved)} (${Math.round(pct(c.saved,inc))}% da renda)${c.inv>0?`, sendo ${brl(c.inv)} em investimentos`:''}. Mande esse valor para a reserva ou investimento assim que cair o salário, antes de gastar.`});
    else out.push({lv:'warn',t:`Faltam ${brl(goal-c.saved)} para a meta de ${S.cfg.savePct}%`,b:'Veja qual categoria de desejos pode ceder esse valor e registre o aporte como investimento. Cortar um pouco de duas ou três costuma doer menos do que zerar uma.'});
  }
  if(inc>0&&c.inv===0&&inc-c.exp>0)out.push({lv:'info',t:'Nenhum investimento registrado neste mês',b:'Se você investiu algum valor, registre como Investimento para ele contar na meta de economia. Se ainda não, comece pela reserva de emergência.'});
  if(inc>0&&pct(c.need,Math.max(inc,c.exp))>50)out.push({lv:'warn',t:`Necessidades pesam ${Math.round(pct(c.need,Math.max(inc,c.exp)))}% da renda`,b:'O ideal é até 50%. Revise contratos fixos: internet, plano de celular, seguros e mensalidades. Renegociar um contrato rende mais do que cortar pequenos gastos do dia a dia.'});
  if(inc>0&&pct(c.want,Math.max(inc,c.exp))>30)out.push({lv:'warn',t:`Desejos já são ${Math.round(pct(c.want,Math.max(inc,c.exp)))}% da renda`,b:'O ideal é até 30%. Escolha uma categoria para reduzir neste mês em vez de tentar apertar tudo ao mesmo tempo.'});
  for(const [id,lim] of Object.entries(S.cfg.limits)){
    const v=c.by[id]||0;
    if(lim&&v>lim)out.push({lv:'alert',t:`${nameOf(id)} passou do limite`,b:`Você definiu ${brl(lim)} e já gastou ${brl(v)}, ${brl(v-lim)} acima. Se faltam dias no mês, segure esta categoria até virar o mês.`});
    else if(lim&&v>lim*.8)out.push({lv:'warn',t:`${nameOf(id)} perto do limite`,b:`Já foram ${brl(v)} de ${brl(lim)}. Restam ${brl(lim-v)} para o resto do mês.`});
  }
  const ass=c.by.assin||0;
  if(inc>0&&pct(ass,inc)>5)out.push({lv:'warn',t:`Assinaturas somam ${brl(ass)}`,b:'Lista todas e cancele as que você não usou nas últimas quatro semanas. É o corte que menos faz falta.'});
  const dv=c.by.dividas||0;
  if(inc>0&&pct(dv,inc)>15)out.push({lv:'alert',t:`Dívidas e parcelas levam ${Math.round(pct(dv,inc))}% da renda`,b:'Priorize quitar a de maior juros primeiro e evite novas parcelas até aliviar. Peça ao banco uma proposta de renegociação ou portabilidade.'});
  const parcMes=S.tx.filter(t=>t.t==='e'&&t.grp&&!t.rec).reduce((s,t)=>s+t.v,0);
  if(inc>0&&pct(parcMes,inc)>20)out.push({lv:'warn',t:`Parcelas comprometem ${Math.round(pct(parcMes,inc))}% da renda`,b:`São ${brl(parcMes)} em parcelas só neste mês. Evite novos parcelamentos até esse valor cair abaixo de 20% da renda, senão sobra pouco espaço para imprevistos.`});
  const fora=c.by.fora||0;
  if(inc>0&&pct(fora,inc)>10)out.push({lv:'info',t:`Comer fora: ${brl(fora)}`,b:'Passa de 10% da renda. Planejar duas refeições por semana em casa já costuma reduzir bastante sem cortar o lazer.'});
  const done=S.ym<ymOf(new Date())||new Date().getDate()>=25;
  if(done&&p.exp>0&&c.exp>p.exp*1.15)out.push({lv:'warn',t:`Gastos subiram ${Math.round(pct(c.exp-p.exp,p.exp))}% em relação ao mês passado`,b:`Foram ${brl(p.exp)} antes e ${brl(c.exp)} agora. Compare as categorias no Resumo para achar o que mudou.`});
  if(c.need>0)out.push({lv:'info',t:`Sua reserva de emergência ideal: ${brl(c.need*6)}`,b:'É o equivalente a seis meses dos seus gastos essenciais deste mês. Guarde em algo seguro com liquidez diária, como Tesouro Selic ou CDB com liquidez diária. Comece por um mês de essenciais e vá subindo.'});
  if(S.tx.length<5)out.push({lv:'info',t:'Poucos registros até agora',b:'Quanto mais completo o registro, mais certeiras ficam as dicas. Anote também os gastos pequenos.'});
  return out;
}

const monthLabel=()=>{const [y,m]=S.ym.split('-').map(Number);return cap(new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))};

/* ---------- abas: pílula deslizante e transição do conteúdo ---------- */
const TABS=['resumo','extrato','metas','dicas','ajustes'];
function placeInd(){
  const ind=$('#tabind'),b=document.querySelector('.tabs button[aria-current="page"]');
  if(!ind||!b||!b.offsetWidth)return;
  ind.style.width=b.offsetWidth+'px';ind.style.height=b.offsetHeight+'px';
  ind.style.transform='translate('+b.offsetLeft+'px,'+b.offsetTop+'px)';
  if(!ind.classList.contains('ready'))requestAnimationFrame(()=>requestAnimationFrame(()=>ind.classList.add('ready')));
}
function goTab(next){
  const from=TABS.indexOf(S.tab),to=TABS.indexOf(next),main=$('#main');
  S.tab=next;S.open=null;S.confirm=null;render();window.scrollTo(0,0);
  $('.fab').classList.remove('away');
  if(from===to)return;
  slideMain(to>from?'go-r':'go-l');
}
function slideMain(cls){const m=$('#main');m.classList.remove('go-l','go-r');void m.offsetWidth;m.classList.add(cls)}
/* o botão Registrar sai da frente quando você rola para baixo e volta quando rola para cima */
(function(){
  let last=window.scrollY,tick=false;
  window.addEventListener('scroll',()=>{
    if(tick)return;tick=true;
    requestAnimationFrame(()=>{
      tick=false;const y=window.scrollY,d=y-last,fab=$('.fab');
      $('.top').classList.toggle('scrolled',y>4);
      if(Math.abs(d)>6){fab.classList.toggle('away',d>0&&y>80);last=y}
      else if(y<=80)fab.classList.remove('away');
    });
  },{passive:true});
})();
/* deslizar para o lado troca de aba, como nos apps do iOS */
(function(){
  let x0=0,y0=0,t0=0,ok=false;
  const bad=t=>t.closest&&t.closest('input,select,textarea,summary,.sheet,#sheet,.tabs');
  document.addEventListener('touchstart',e=>{
    const t=e.touches[0];ok=e.touches.length===1&&!bad(e.target)&&$('#sheet').hidden&&$('#year').hidden&&!document.body.classList.contains('welcome')&&t.clientX>24&&t.clientX<window.innerWidth-24;
    x0=t.clientX;y0=t.clientY;t0=e.timeStamp;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!ok)return;ok=false;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)<80||Math.abs(dy)>50||Math.abs(dx)<Math.abs(dy)*2.5||e.timeStamp-t0>600)return;
    const i=TABS.indexOf(S.tab),n=dx<0?i+1:i-1;
    if(n>=0&&n<TABS.length)goTab(TABS[n]);
  },{passive:true});
})();

function openSheet(t){

  $('#amt').value=t?moneyField(t.v):'';$('#desc').value=t?t.d:'';$('#erro').textContent='';
  const dt=$('#dt'),first=S.ym+'-01',last=S.ym+'-'+pad(daysIn(S.ym));
  dt.min=first;dt.max=last;dt.value=t?t.date:(isCurrent()?todayStr():first);
  const g=t&&t.grp;
  const isRec=!!(t&&t.rec),more=g&&(isRec||t.n<t.of);
  S.mode='p';S.editT=t||null;S.rec=false;$('#np').value=g&&!isRec?String(t.of):'1';
  $('#nplbl').textContent=isRec?'Repetição':g?`Total de parcelas (esta é a ${t.n}ª)`:'Em quantas parcelas?';
  $('#delbtn').hidden=!t;$('#delbtn').textContent=isRec?'Excluir só deste mês':g?'Excluir só esta parcela':'Excluir lançamento';
  $('#delbtn2').hidden=!more;$('#delbtn2').textContent=isRec?'Excluir e encerrar a repetição mensal':'Excluir esta e as parcelas seguintes';
  $('#applyrow').hidden=!more;$('#applyf').checked=false;
  $('#applylbl').textContent=isRec?'Aplicar valor, nome e categoria também aos meses seguintes':'Aplicar valor, nome e categoria também às parcelas seguintes';
  $('#parcread').hidden=!g;if(g)$('#parcread').textContent=isRec?'Este gasto se repete todo mês. Alterar a data vale só para este mês.':`Parcela ${t.n} de ${t.of}. Alterar a data vale só para esta parcela.`;
  $('#savebtn').textContent=t?'Salvar alterações':'Salvar';
  $('#form').setAttribute('aria-label',t?'Editar lançamento':'Novo lançamento');
  $('#stitle').textContent=t?'Editar lançamento':'Novo lançamento';
  clearTimeout(S.closeT);S.closing=false;
  resetDrag();$('#sbody').scrollTop=0;
  paintForm();$('#sheet').hidden=false;document.documentElement.classList.add('lock');
  setTimeout(()=>$('#amt').focus({preventScroll:true}),30);
}
function paintParc(){
  const t=S.editT,g=t&&t.grp,isRec=!!(t&&t.rec);
  const n=Math.max(1,Math.min(60,parseInt($('#np').value,10)||1)),v=rnd(parseMoney($('#amt').value));
  document.querySelectorAll('#npchips .chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.n==='m'?S.rec:(!S.rec&&+b.dataset.n===n))));
  document.querySelectorAll('#modeseg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===S.mode)));
  $('#recchip').hidden=!!(g&&!isRec);
  $('#npchips').hidden=isRec;$('#np').hidden=isRec||S.rec;
  $('#modeseg').hidden=S.rec||isRec||n<2||!!g;
  const el=$('#parcinfo');
  if(isRec){el.textContent='Este gasto se repete todo mês, sem data para acabar. Mudanças valem só para este mês, a não ser que você marque a opção abaixo.';return}
  if(S.rec){el.textContent=`Todo mês, sem data para acabar. Começa em ${mName(S.ym,true).toLowerCase()} e aparece sozinho nos meses seguintes. Você pode encerrar quando quiser.`;return}
  if(g){
    const lower=ym=>mName(ym,true).toLowerCase();
    if(n<t.n)el.textContent=`O total não pode ser menor que a parcela atual (${t.n}). Vou manter ${t.n}.`;
    else if(n===t.of)el.textContent=`Hoje são ${t.of} parcelas. Mude o número para aumentar ou reduzir o total.`;
    else if(n>t.of)el.textContent=`O total passa de ${t.of} para ${n} parcelas. Acrescento ${n-t.of} no fim, de ${lower(shiftYm(S.ym,t.of-t.n+1))} até ${lower(shiftYm(S.ym,n-t.n))}, com o valor desta parcela.`;
    else el.textContent=`O total cai de ${t.of} para ${n} parcelas. As parcelas ${n+1} a ${t.of} serão removidas.`;
    return;
  }
  if(n<2){el.textContent='Pagamento à vista, só neste mês.';return}
  if(!(v>0)){el.textContent='Informe o valor para ver o resumo das parcelas.';return}
  const a=S.mode==='p'?Array(n).fill(v):split(v,n),total=a.reduce((s,x)=>s+x,0);
  el.textContent=`${n} parcelas de ${brl(a[0])} (total ${brl(total)}), de ${mName(S.ym,true).toLowerCase()} até ${mName(shiftYm(S.ym,n-1),true).toLowerCase()}. Elas aparecem sozinhas nos meses seguintes.`;
}

/* fecha com animação: a folha desce e o fundo escurecido some */
function dismissSheet(){
  const s=$('#sheet');if(s.hidden||S.closing)return;
  S.closing=true;
  const sh=$('#form'),scrim=$('#sheet .scrim');
  sh.style.transition='transform .28s cubic-bezier(.4,0,.9,.6)';scrim.style.transition='opacity .28s ease';
  sh.style.transform='translateY(100%)';scrim.style.opacity='0';

function resetDrag(){const sh=$('#form');sh.style.transition='';sh.style.transform='';$('#sheet .scrim').style.opacity=''}
/* deslizar para baixo fecha a folha: pelo topo (alça e título) ou pelo corpo quando ele está rolado até o início */
(function(){
  const sh=$('#form'),hd=$('#shead'),sb=$('#sbody'),scrim=$('#sheet .scrim');
  let y0=null,dy=0,t0=0,mode=null,raf=0;
  const begin=(y,ts,m)=>{y0=y;dy=0;t0=ts;mode=m;sh.style.transition='none';scrim.style.transition='none'};
  /* arrastar para cima tem resistência; para baixo acompanha o dedo, desenhado uma vez por quadro */
  const move=y=>{
    const d=y-y0;dy=d>0?d:d/6;
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;sh.style.transform='translateY('+dy+'px)';scrim.style.opacity=String(Math.max(.15,Math.min(1,1-dy/360)))});
  };
  const finish=ts=>{
    if(y0==null)return;
    if(raf){cancelAnimationFrame(raf);raf=0}
    const v=Math.max(dy,0)/Math.max(1,ts-t0);y0=null;mode=null;
    if(dy>100||(v>.55&&dy>24)){
      sh.style.transition='transform .22s cubic-bezier(.3,0,.8,.6)';scrim.style.transition='opacity .22s ease';
      sh.style.transform='translateY(100%)';scrim.style.opacity='0';S.closing=true;S.closeT=setTimeout(()=>{scrim.style.transition='';closeSheet()},210);
    }else{
      sh.style.transition='transform .34s cubic-bezier(.22,1.2,.36,1)';scrim.style.transition='opacity .25s ease';
      sh.style.transform='';scrim.style.opacity='';
    }
  };
  hd.addEventListener('pointerdown',e=>{
    if(e.target.closest('.xbtn'))return;
    begin(e.clientY,e.timeStamp,'head');try{hd.setPointerCapture(e.pointerId)}catch(_){}
  });
  hd.addEventListener('pointermove',e=>{if(mode==='head')move(e.clientY)});
  hd.addEventListener('pointerup',e=>{if(mode==='head')finish(e.timeStamp)});
  hd.addEventListener('pointercancel',e=>{if(mode==='head')finish(e.timeStamp)});
  sb.addEventListener('touchstart',e=>{
    if(sb.scrollTop>0||e.touches.length!==1||e.target.closest('input,select,textarea'))return;
    begin(e.touches[0].clientY,e.timeStamp,'wait');
  },{passive:true});
  sb.addEventListener('touchmove',e=>{
    if(!mode||mode==='head')return;
    const d=e.touches[0].clientY-y0;
    if(mode==='wait'){
      if(d<-4||sb.scrollTop>0){y0=null;mode=null;sh.style.transition='';return}
      if(d>8)mode='drag';else return;
    }
    e.preventDefault();move(e.touches[0].clientY);
  },{passive:false});
  sb.addEventListener('touchend',e=>{if(mode==='drag')finish(e.timeStamp);else if(mode==='wait'){y0=null;mode=null;sh.style.transition=''}});
  sb.addEventListener('touchcancel',e=>{if(mode==='drag')finish(e.timeStamp);else{y0=null;mode=null;sh.style.transition=''}});
  scrim.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
})();

function parseMoney(s){
  s=String(s).trim().replace(/[R$\s]/g,'');if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  return parseFloat(s);
}
/* campo de valor: os dígitos entram pelos centavos (4590 vira 45,90) e a vírgula e os pontos aparecem sozinhos */
function maskMoney(s){
  const d=String(s).replace(/\D/g,'').replace(/^0+/,'').slice(0,11);
  if(!d)return '';
  const p=d.padStart(3,'0');
  return p.slice(0,-2).replace(/\B(?=(\d{3})+$)/g,'.')+','+p.slice(-2);
}
const moneyField=v=>maskMoney(Math.round(v*100));
function submit(e){
  e.preventDefault();
  const v=rnd(parseMoney($('#amt').value)),date=$('#dt').value,err=$('#erro');
  if(!(v>0)||v>1e9){err.textContent='Informe um valor maior que zero, como 45,90.';$('#amt').focus();return}
  if(!date||date.slice(0,7)!==S.ym){err.textContent='Escolha uma data dentro de '+monthLabel().toLowerCase()+'.';return}
  const t={id:uid(),t:S.kind,v,c:S.cat,d:$('#desc').value.trim().slice(0,60),date};
  const np=S.kind==='e'?Math.max(1,Math.min(60,parseInt($('#np').value,10)||1)):1;
  if(S.editId){
    const id=S.editId,old=S.tx.find(x=>x.id===id),nt={...t,id};
    let msg='Alterações salvas.';
    if(old&&old.rec){
      if(S.kind==='e'){
        nt.grp=old.grp;nt.rec=1;
        if($('#applyf').checked){
          const r=S.cfg.recs.find(x=>x.grp===old.grp);
          setRec(old.grp,x=>({...x,v:nt.v,d:nt.d,c:nt.c}));
          if(r&&r.upto>S.ym)mutateRange(shiftYm(S.ym,1),r.upto,cur=>cur.some(x=>x.grp===old.grp)?cur.map(x=>x.grp===old.grp?{...x,v:nt.v,d:nt.d,c:nt.c}:x):null);
          msg='Alterações salvas neste mês e nos seguintes.';
        }
      }else{
        setRec(old.grp,x=>({...x,skip:[...(x.skip||[]),S.ym]}));
      }
    }else if(old&&old.grp&&S.kind==='e'){
      nt.grp=old.grp;nt.n=old.n;nt.of=old.of;
      const newOf=Math.max(old.n,np);
      if(newOf!==old.of){
        nt.of=newOf;
        mutateGroup(old,cur=>{
          let ch=false,nx=cur.map(x=>{if(x.grp===old.grp){ch=true;return {...x,of:newOf}}return x});
          if(newOf<old.of){const k=nx.filter(x=>!(x.grp===old.grp&&x.n>newOf));if(k.length!==nx.length)ch=true;nx=k}
          return ch?nx:null;
        });
        if(newOf>old.of)addFuture(parcelItems(nt,old.n,old.of+1,newOf,old.grp,newOf,()=>nt.v));
        msg=`Parcelamento ajustado para ${newOf} parcelas.`;
      }
    }else if(old&&!old.grp&&S.kind==='e'&&S.rec){
      nt.grp=newSeries(nt);nt.rec=1;
      msg='Agora este gasto se repete todo mês.';
    }else if(old&&!old.grp&&S.kind==='e'&&np>1){
      const amts=S.mode==='p'?Array(np).fill(v):split(v,np),grp='g'+uid();
      nt.v=amts[0];nt.grp=grp;nt.n=1;nt.of=np;
      addFuture(parcelItems(nt,1,2,np,grp,np,n=>amts[n-1]));
      msg=`Dividido em ${np} parcelas. Elas aparecem nos próximos meses.`;
    }
    S.tx=S.tx.map(x=>x.id===id?nt:x);
    if(old&&old.grp&&nt.grp&&old.n<old.of&&$('#applyf').checked)mutateFuture(old,cur=>cur.some(x=>x.grp===old.grp)?cur.map(x=>x.grp===old.grp&&x.n<=nt.of?{...x,v:nt.v,d:nt.d,c:nt.c}:x):null);
    S.editId=null;S.open=null;saveMonth();dismissSheet();render();toast(msg);return;
  }
  if(S.kind==='e'&&S.rec){
    const grp=newSeries(t);
    S.tx=[...S.tx,{...t,grp,rec:1}];saveMonth();dismissSheet();render();
    toast('Gasto mensal criado. Ele aparece todo mês, sozinho.');return;
  }
  if(np>1){
    const amts=S.mode==='p'?Array(np).fill(v):split(v,np),grp='g'+uid();
    S.tx=[...S.tx,{...t,v:amts[0],grp,n:1,of:np}];saveMonth();addFuture(parcelItems(t,1,2,np,grp,np,n=>amts[n-1]));dismissSheet();render();
    toast(`${np} parcelas registradas. Elas aparecem nos próximos meses.`);return;
  }
  S.tx=[...S.tx,t];saveMonth();dismissSheet();render();toast(S.kind==='e'?'Gasto registrado.':S.kind==='v'?'Investimento registrado.':'Entrada registrada.');
}

async function start(){
  render();
  let db=null,user=null;
  try{
    if(window.claude&&window.claude.use){
      [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    }
  }catch(e){}
  let uid=null;
  try{uid=user?await user.id():null}catch(e){}
  if(uid)lsSet('mbc:lastuid',uid);
  else if(db)uid=lsGet('mbc:lastuid');   /* sem internet o id pode não vir: usa o último conhecido */
  if(db&&uid){
    S.db=db;S.uid=uid;
    setOffline(!navigator.onLine);
    try{
      /* sem resposta da conta (offline): usa a cópia das configurações que está no aparelho */
      S.cfgT=setTimeout(()=>{
        if(S.cfgLoaded)return;
        loadCfg(cacheGet('cfg'));S.cfgLoaded=true;setOffline(true);render();
      },S.offline?0:3500);
      db.doc(docPath('cfg')).onSnapshot(s=>{
        clearTimeout(S.cfgT);
        if(isDirty('cfg')){loadCfg(cacheGet('cfg'));S.recFor=null;flush()}
        else if(!S.pending){const d=s.exists?s.data():null;loadCfg(d);cachePut('cfg',d);S.recFor=null}
        S.cfgLoaded=true;if(!typing())render();
        if(S.loaded)refreshNext();
      },()=>{clearTimeout(S.cfgT);loadCfg(cacheGet('cfg'));S.cfgLoaded=true;setOffline(true);render()});
    }catch(e){S.db=null}
  }
  if(!S.db){S.local=true;loadCfg(lsGet('mb:cfg'));S.cfgLoaded=true}
  watchMonth();
  if(S.db){
    flush();
    [-3,-2,2,3].forEach(k=>loadMonth(shiftYm(S.ym,k)));   /* deixa meses próximos prontos para ver sem internet */
  }
  try{
    const sm=window.claude&&window.claude.use?await window.claude.use('sample'):null;
    if(sm){S.ai=sm;if(S.tab==='dicas')render()}
  }catch(e){}
}

function doImport(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||o.app!=='meu-bolso'||!o.data||typeof o.data!=='object')throw new Error('formato');
      const keys=Object.keys(o.data).filter(k=>k.startsWith('mb:')&&typeof o.data[k]==='string');
      if(!keys.length)throw new Error('vazio');
      const before=backupData().data;
      Object.keys(localStorage).filter(k=>k.startsWith('mb:')).forEach(k=>localStorage.removeItem(k));
      keys.forEach(k=>localStorage.setItem(k,o.data[k]));
      const reload=()=>{loadCfg(lsGet('mb:cfg'));S.recFor=null;S.tab='resumo';watchMonth()};
      reload();
      S.undoFn=()=>{Object.keys(localStorage).filter(k=>k.startsWith('mb:')).forEach(k=>localStorage.removeItem(k));Object.keys(before).forEach(k=>localStorage.setItem(k,before[k]));reload()};
      toast('Backup restaurado.',true);
    }catch(e){toast('Esse arquivo não parece um backup do Meu Bolso.')}
  };
  r.readAsText(file);
}

    <label class="hint" for="tiph" style="margin-top:12px">Horário do aviso</label>
    <select id="tiph">${remOpts(TIP_HM,tipH()*100+tipM())}</select>
    <div class="acts2" style="margin-top:12px"><a class="primary" style="display:inline-flex;align-items:center;text-decoration:none" href="${tipUrl()}" target="_blank" rel="noopener">Adicionar ao Calendário</a></div>
    <p class="hint" style="margin-top:12px">Toque em <b>Adicionar ao Calendário</b>. Quando o iPhone mostrar os eventos, toque em <b>Adicionar Tudo</b> e escolha o calendário. Crie um chamado "Dicas" para poder apagar tudo de uma vez. Se mudar o horário depois, apague esse calendário e adicione de novo.</p></section>`;
}
document.addEventListener('change',e=>{
  if(e.target.id!=='tiph')return;
  const v=+e.target.value;S.cfg={...S.cfg,tipH:Math.floor(v/100),tipM:v%100};saveCfg();render();
});
/* passo a passo para instalar o app, mostrado a quem abre o link pelo navegador */
const inst={step:0,deferred:null};
const instSkipped=()=>{try{return sessionStorage.getItem('mbSkipInst')==='1'}catch(e){return false}};
S.install=!isStandalone()&&!instSkipped();
function instEnv(){
  const ua=navigator.userAgent||'',ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios){
    if(/FBAN|FBAV|Instagram|Line\/|MicroMessenger|Snapchat|TikTok|; wv\)/.test(ua)||!/Safari\//.test(ua))return 'ios-inapp';
    return /CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(ua)?'ios-other':'ios-safari';
  }
  if(/Android/.test(ua))return 'android';
  return 'desktop';
}
const IA={
  share:'<span class="iart-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M7 11H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg></span>',
  addhome:'<span class="iart-row">Adicionar à Tela de Início<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>',
  confirm:'<span class="iart-btn">Adicionar</span>',
  icon:'<img src="icon-v2-192.png" width="88" height="88" alt="" style="border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.2)">',
  dots:'<span class="iart-pill"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></span>',
  install:'<span class="iart-row">Instalar app<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M8 11l4 4 4-4M5 20h14"/></svg></span>',
  link:'<span class="iart-row">Copiar link<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></span>'
};
function instSteps(){
  const env=instEnv(),end={t:'Abra pelo ícone',d:'Feche esta página e abra o <b>Meu Bolso</b> pelo ícone, com internet. Daí ele funciona até sem internet.',art:'icon'};
  const safari=[
    {t:'Toque em Compartilhar',d:'É o botão com um quadrado e uma seta para cima, na barra de baixo do Safari.',art:'share'},
    {t:'Adicionar à Tela de Início',d:'Role a lista para cima e toque em <b>Adicionar à Tela de Início</b>.',art:'addhome'},
    {t:'Toque em Adicionar',d:'No canto de cima, à direita. O ícone do bolso aparece na sua Tela de Início.',art:'confirm'},
    end
  ];
  if(env==='ios-safari')return safari;
  if(env==='ios-other'||env==='ios-inapp')return [{t:'Abra no Safari',d:env==='ios-inapp'?'Este navegador não instala apps. Copie o link, abra o <b>Safari</b> e cole na barra de endereço.':'O jeito mais seguro de instalar é pelo <b>Safari</b>. Copie o link, abra o Safari e cole na barra de endereço.',art:'link',btn:['instcopy','Copiar link']},...safari];
  if(env==='android'){
    const first=inst.deferred
      ?{t:'Toque em Instalar',d:'O navegador já pode instalar o app para você.',art:'install',btn:['instprompt','Instalar agora']}
      :{t:'Abra o menu',d:'Toque nos três pontinhos, no canto de cima do navegador.',art:'dots'};
    return [first,...(inst.deferred?[]:[{t:'Instalar app',d:'Toque em <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>).',art:'install'}]),{t:'Confirme',d:'Toque em <b>Instalar</b>. O ícone aparece junto dos seus outros apps.',art:'confirm'},end];
  }
  return [
    {t:'Melhor no celular',d:'O Meu Bolso foi feito para o celular. Copie o link e abra no navegador do seu telefone.',art:'link',btn:['instcopy','Copiar link']},
    {t:'Siga os passos no celular',d:'No iPhone, use o <b>Safari</b> e toque em <b>Compartilhar</b> e em <b>Adicionar à Tela de Início</b>. No Android, abra o menu e toque em <b>Instalar app</b>.',art:'addhome'}
  ];
}
function vInstall(){
  const st=instSteps();inst.step=Math.min(inst.step,st.length-1);
  const s=st[inst.step],n=st.length,last=inst.step===n-1;
  return `<section class="boas inst"><p class="lbl">Meu Bolso</p>
    <h1>Instale no seu celular</h1>
    <p class="hint">Leva um minuto e o app passa a abrir pelo ícone, em tela cheia e até sem internet.</p>
    <div class="wiz" role="group" aria-label="Passo ${inst.step+1} de ${n}">
      <div class="dots" aria-hidden="true">${st.map((_,i)=>`<i class="${i<inst.step?'done':i===inst.step?'now':''}"></i>`).join('')}</div>
      <p class="wk">Passo ${inst.step+1} de ${n}</p>
      <div class="iart" aria-hidden="true">${IA[s.art]||''}</div>
      <h3>${s.t}</h3><p class="wd">${s.d}</p>
      ${s.btn?`<div class="acts2" style="margin-top:10px"><button class="ghost" data-act="${s.btn[0]}">${s.btn[1]}</button></div>`:''}
      <div class="wnav">${inst.step>0?'<button class="ghost" data-act="instback">Voltar</button>':'<span></span>'}
        <button class="primary" data-act="${last?'instskip':'instnext'}">${last?'Entendi':'Próximo'}</button></div>
    </div>
    <button class="ghost" style="width:100%;margin-top:6px" data-act="instskip">Continuar no navegador por enquanto</button>
    <p class="hint" style="font-size:.82rem">O que você registrar no navegador não passa para o app instalado. Para não perder nada, comece a registrar só depois de abrir pelo ícone.</p></section>`;
}
function installCard(){
  if(isStandalone())return '';
  return `<section class="card"><h2>Instalar o app</h2><p class="hint">Abra o Meu Bolso pelo ícone da Tela de Início para usar sem internet e receber notificações.</p><button class="primary full" style="margin-top:12px" data-act="installguide">Ver como instalar</button></section>`;
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();inst.deferred=e;if(S.install)render()});
window.addEventListener('appinstalled',()=>{inst.deferred=null;toast('Instalado! Abra o Meu Bolso pelo ícone.')});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='installguide'){inst.step=0;S.install=true;render();window.scrollTo(0,0)}
  else if(a==='instnext'){inst.step++;render()}
  else if(a==='instback'){inst.step=Math.max(0,inst.step-1);render()}
  else if(a==='instskip'){try{sessionStorage.setItem('mbSkipInst','1')}catch(err){}S.install=false;render();window.scrollTo(0,0)}
  else if(a==='instcopy'){
    const ok=()=>toast('Link copiado.'),fail=()=>toast('Não consegui copiar. Copie o endereço na barra do navegador.');
    try{navigator.clipboard.writeText(APP_URL).then(ok,fail)}catch(err){fail()}
  }
  else if(a==='instprompt'&&inst.deferred){
    try{inst.deferred.prompt();await inst.deferred.userChoice}catch(err){}
    inst.deferred=null;render();
  }
});
(()=>{const s=document.createElement('style');s.textContent='.inst{justify-content:flex-start;padding-top:28px}.iart{display:grid;place-items:center;min-height:110px;margin:4px 0 14px;border-radius:16px;background:var(--fill);padding:18px;color:var(--ink)}.iart svg{width:26px;height:26px}.iart-pill{display:grid;place-items:center;width:72px;height:56px;border-radius:28px;background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}.iart-pill svg{width:30px;height:30px}.iart-row{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;max-width:300px;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:14px 16px;font-weight:600}.iart-btn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 22px;font-weight:700}';document.head.append(s)})();

start();
})();
</script>
</body>
</html>
